<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="北京数学刷题">
<meta name="mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#165DFF">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" id="manifestLink" href="data:application/json,{}">
<title>北京高中数学刷题 — AI增强版</title>
<script>
window.MathJax={tex:{inlineMath:[['$','$'],['\\(','\\)']],displayMath:[['$$','$$'],['\\[','\\]']]},options:{ignoreHtmlClass:'no-mathjax',enableMenu:false}};
</script>
<script async src="https://cdn.jsdelivr.net/npm/mathjax@3/es5/tex-mml-chtml.js"></script>
<style>
:root{
  --pri:#165DFF;--pri2:#0E42D2;--suc:#36D399;--err:#F87272;--warn:#FBBF24;
  --bg:#F0F4FF;--bg2:rgba(255,255,255,0.75);--card:rgba(255,255,255,0.82);--txt:#1F2937;--txt2:#9CA3AF;--txt3:#6B7280;
  --border:rgba(229,231,235,0.7);--shadow:0 2px 8px rgba(0,0,0,0.05);--shadow2:0 4px 16px rgba(0,0,0,0.08);
  --radius:12px;--radius2:8px;--font:'Inter','Microsoft YaHei','PingFang SC',sans-serif;
  --trans:0.3s cubic-bezier(0.4,0,0.2,1);--blur:blur(12px);--gradient:linear-gradient(135deg,#E8EEFF 0%,#F3F0FF 40%,#E8F4FD 100%);
}
body.dark{
  --bg:#0D1117;--bg2:rgba(31,41,55,0.7);--card:rgba(31,41,55,0.78);--txt:#F9FAFB;--txt2:#9CA3AF;--txt3:#D1D5DB;
  --border:rgba(55,65,81,0.6);--shadow:0 2px 8px rgba(0,0,0,0.3);--shadow2:0 4px 16px rgba(0,0,0,0.4);
  --gradient:linear-gradient(135deg,#0D1117 0%,#1a1040 40%,#0D1B2A 100%);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:var(--font);background:var(--gradient);background-attachment:fixed;color:var(--txt);min-height:100vh;line-height:1.7;overflow:hidden}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse at 20% 50%,rgba(22,93,255,0.04) 0%,transparent 50%),radial-gradient(ellipse at 80% 20%,rgba(54,211,153,0.03) 0%,transparent 50%);pointer-events:none;z-index:0}
.app{display:flex;height:100vh;position:relative;z-index:1}
/* Sidebar */
.sidebar{width:280px;min-width:280px;background:var(--card);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-right:1px solid var(--border);display:flex;flex-direction:column;z-index:20;transition:all var(--trans)}
.sidebar-header{padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;gap:10px}
.sidebar-header .logo{font-size:15px;font-weight:700;color:var(--pri);letter-spacing:0.5px}
.sidebar-header .grade-badge{padding:2px 10px;border-radius:12px;font-size:11px;font-weight:600;background:rgba(22,93,255,0.1);color:var(--pri);cursor:pointer;white-space:nowrap}
.sidebar-header .grade-badge:hover{background:var(--pri);color:#fff}
.sidebar-nav{flex:1;overflow-y:auto;padding:8px 10px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.sidebar-nav::-webkit-scrollbar{width:4px}
.sidebar-nav::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
.tree-group{margin-bottom:2px}
.tree-group-title{padding:7px 10px;font-size:12px;font-weight:700;color:var(--txt);cursor:pointer;border-radius:6px;display:flex;align-items:center;justify-content:space-between;user-select:none;transition:all var(--trans)}
.tree-group-title:hover{background:var(--bg2)}
.tree-group-title .arr{font-size:8px;transition:transform var(--trans);color:var(--txt2)}
.tree-group-title.collapsed .arr{transform:rotate(-90deg)}
.tree-children{padding-left:6px}
.tree-chapter{padding:5px 10px;font-size:11.5px;cursor:pointer;border-radius:5px;margin:1px 0;color:var(--txt3);transition:all var(--trans);display:flex;align-items:center;justify-content:space-between;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tree-chapter:hover{background:var(--bg2);color:var(--txt)}
.tree-chapter.active{background:rgba(22,93,255,0.1);color:var(--pri);font-weight:600}
.tree-chapter .ch-mastery{font-size:9px;padding:1px 6px;border-radius:8px;font-weight:600;margin-left:4px;flex-shrink:0}
.tree-chapter .ch-mastery.good{background:rgba(54,211,153,0.15);color:#1F9D6F}
.tree-chapter .ch-mastery.mid{background:rgba(251,191,36,0.15);color:#B8860B}
.tree-chapter .ch-mastery.weak{background:rgba(248,114,114,0.15);color:#D14343}
.tree-unit{padding:4px 8px 4px 20px;font-size:11px;cursor:pointer;border-radius:4px;color:var(--txt2);transition:all var(--trans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tree-unit:hover{color:var(--txt);background:var(--bg2)}
.tree-unit.active{color:var(--pri);font-weight:600}
.sidebar-footer{padding:10px 14px;border-top:1px solid var(--border);display:flex;flex-direction:column;gap:4px}
.sidebar-footer button{padding:7px 10px;border:1px solid var(--border);border-radius:6px;background:var(--card);color:var(--txt);cursor:pointer;font-size:11.5px;font-family:var(--font);transition:all var(--trans);text-align:center}
.sidebar-footer button:hover{background:var(--bg2);border-color:var(--pri);color:var(--pri)}
/* Main */
.main{flex:1;display:flex;flex-direction:column;overflow:hidden}
.topbar{display:flex;align-items:center;gap:10px;padding:12px 24px;border-bottom:1px solid var(--border);background:var(--card);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);flex-shrink:0}
.topbar h1{font-size:17px;font-weight:700;color:var(--txt);margin-right:auto;letter-spacing:-0.3px}
.topbar .tb-badge{padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600;background:rgba(22,93,255,0.08);color:var(--pri)}
.main-content{flex:1;overflow-y:auto;padding:24px;scrollbar-width:thin;scrollbar-color:var(--border) transparent}
.main-content::-webkit-scrollbar{width:5px}
.main-content::-webkit-scrollbar-thumb{background:var(--border);border-radius:4px}
/* Cards */
.card{background:var(--card);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--border);border-radius:var(--radius);padding:24px;box-shadow:var(--shadow);transition:all var(--trans)}
.card:hover{box-shadow:var(--shadow2);transform:translateY(-1px)}
.card+.card{margin-top:16px}
/* Buttons */
.btn{padding:10px 22px;border:none;border-radius:var(--radius2);cursor:pointer;font-size:14px;font-family:var(--font);font-weight:600;transition:all var(--trans);display:inline-flex;align-items:center;gap:6px;letter-spacing:0.2px}
.btn:active{transform:scale(0.97)}
.btn-pri{background:linear-gradient(135deg,var(--pri),var(--pri2));color:#fff}.btn-pri:hover{box-shadow:0 6px 20px rgba(22,93,255,0.35);transform:translateY(-2px)}
.btn-suc{background:var(--suc);color:#fff}.btn-err{background:var(--err);color:#fff}
.btn-out{background:transparent;border:2px solid var(--pri);color:var(--pri)}
.btn-out:hover{background:var(--pri);color:#fff}
.btn-ghost{background:transparent;color:var(--txt2);border:1px solid transparent}
.btn-ghost:hover{background:var(--bg2);color:var(--txt)}
.btn-sm{padding:5px 12px;font-size:12px;border-radius:6px}
.btn-xs{padding:3px 8px;font-size:11px;border-radius:5px}
.btn:disabled{opacity:0.5;cursor:not-allowed;transform:none!important;box-shadow:none!important}
/* Onboarding */
.onboard-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.5);z-index:100;display:flex;align-items:center;justify-content:center;animation:fadeIn 0.3s}
.onboard-card{background:var(--card);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-radius:16px;padding:32px;max-width:480px;width:90%;box-shadow:0 20px 60px rgba(0,0,0,0.15);animation:slideUp 0.4s cubic-bezier(0.34,1.56,0.64,1)}
.onboard-card h2{font-size:22px;font-weight:700;text-align:center;margin-bottom:4px}
.onboard-card .ob-sub{text-align:center;font-size:13px;color:var(--txt2);margin-bottom:24px}
.ob-section{margin-bottom:20px}
.ob-section label{display:block;font-size:12px;font-weight:700;color:var(--txt3);margin-bottom:8px;text-transform:uppercase;letter-spacing:0.5px}
.ob-grid{display:grid;gap:8px}
.ob-grid.cols2{grid-template-columns:1fr 1fr}
.ob-grid.cols3{grid-template-columns:1fr 1fr 1fr}
.ob-opt{padding:10px 14px;border:2px solid var(--border);border-radius:8px;cursor:pointer;text-align:center;font-size:13px;font-weight:500;transition:all var(--trans);background:var(--bg)}
.ob-opt:hover{border-color:var(--pri);background:rgba(22,93,255,0.03)}
.ob-opt.sel{border-color:var(--pri);background:rgba(22,93,255,0.08);color:var(--pri);font-weight:700}
/* Diff buttons */
.diff-row{display:flex;gap:6px}
.diff-btn{padding:5px 14px;border:1.5px solid var(--border);border-radius:16px;cursor:pointer;font-size:12px;font-family:var(--font);background:var(--card);color:var(--txt2);transition:all var(--trans);font-weight:500}
.diff-btn:hover{border-color:var(--pri);color:var(--pri)}
.diff-btn.active{background:var(--pri);color:#fff;border-color:var(--pri)}
/* Question */
.q-header{display:flex;align-items:center;gap:8px;margin-bottom:16px;flex-wrap:wrap}
.q-tag{padding:3px 10px;border-radius:12px;font-size:11px;font-weight:600}
.q-tag.easy{background:rgba(54,211,153,0.12);color:#1F9D6F}
.q-tag.medium{background:rgba(251,191,36,0.12);color:#B8860B}
.q-tag.hard{background:rgba(248,114,114,0.12);color:#D14343}
.q-body{font-size:14.5px;line-height:2;margin-bottom:18px}
.options{display:flex;flex-direction:column;gap:8px}
.opt{padding:12px 16px;border:2px solid var(--border);border-radius:var(--radius2);cursor:pointer;transition:all var(--trans);font-size:14px;display:flex;align-items:flex-start;gap:10px}
.opt:hover{border-color:var(--pri);background:rgba(22,93,255,0.03)}
.opt.sel{border-color:var(--pri);background:rgba(22,93,255,0.06);box-shadow:0 0 0 1px var(--pri)}
.opt.correct{border-color:var(--suc);background:rgba(54,211,153,0.05)}
.opt.wrong{border-color:var(--err);background:rgba(248,114,114,0.05)}
.opt.disabled{pointer-events:none;opacity:0.75}
.opt-lbl{font-weight:700;color:var(--pri);min-width:24px;font-size:14px}
.fill-inp{width:100%;padding:12px 16px;border:2px solid var(--border);border-radius:var(--radius2);font-size:15px;font-family:var(--font);background:var(--bg);color:var(--txt);outline:none;transition:border-color var(--trans)}
.fill-inp:focus{border-color:var(--pri)}
.btn-row{display:flex;gap:8px;margin-top:16px;flex-wrap:wrap}
/* Result */
.result{margin-top:16px;padding:16px;border-radius:var(--radius2);display:none;animation:fadeIn 0.3s}
.result.show{display:block}
.result.correct{background:rgba(54,211,153,0.06);border:1px solid var(--suc)}
.result.wrong{background:rgba(248,114,114,0.06);border:1px solid var(--err)}
.result .res-title{font-weight:700;font-size:15px;margin-bottom:8px}
.result .res-kw{display:flex;gap:4px;flex-wrap:wrap;margin-bottom:10px}
.result .res-kw span{display:inline-block;padding:3px 10px;background:rgba(22,93,255,0.1);color:var(--pri);border-radius:12px;font-size:11px;font-weight:600}
.result .res-exp{font-size:13.5px;line-height:1.9;color:var(--txt3)}
.result .res-steps{margin-top:8px}
.result .res-step{padding:6px 0;font-size:13px;color:var(--txt3);border-bottom:1px dashed var(--border)}
.result .res-step:last-child{border-bottom:none}
.result .res-score{font-weight:700;color:var(--pri);margin-left:4px}
/* Graphic */
.gfx-box{border:1px dashed var(--border);border-radius:8px;padding:14px;margin-top:10px;text-align:center;background:var(--bg2);overflow-x:auto}
.gfx-box svg{max-width:100%;height:auto}
body.dark .gfx-box svg{filter:invert(0.85) hue-rotate(180deg)}
.gfx-box .gfx-caption{font-size:11px;color:var(--txt2);margin-top:6px}
.gfx-toggle{font-size:12px;color:var(--pri);cursor:pointer;font-weight:600;display:inline-block;margin:6px 0;user-select:none}
.gfx-toggle:hover{text-decoration:underline}
/* Batch */
.batch-tabs{display:flex;gap:4px;margin-bottom:14px;flex-wrap:wrap}
.batch-tab{padding:6px 14px;border:1px solid var(--border);border-radius:16px;cursor:pointer;font-size:12px;font-family:var(--font);background:var(--card);color:var(--txt2);transition:all var(--trans)}
.batch-tab:hover{border-color:var(--pri)}
.batch-tab.active{background:var(--pri);color:#fff;border-color:var(--pri)}
.batch-tab.done{background:rgba(54,211,153,0.1);border-color:var(--suc);color:#1F9D6F}
.batch-tab.wrong{background:rgba(248,114,114,0.1);border-color:var(--err);color:#D14343}
.batch-tab.err{background:rgba(248,114,114,0.12);border-color:var(--err);text-decoration:line-through}
.prog-bar{height:4px;background:var(--border);border-radius:2px;margin-bottom:12px;overflow:hidden}
.prog-bar-fill{height:100%;background:var(--pri);border-radius:2px;transition:width 0.3s}
/* Stats */
.stats-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px;margin-bottom:20px}
.stat-card{background:var(--card);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--border);border-radius:var(--radius);padding:18px;text-align:center;box-shadow:var(--shadow);transition:all var(--trans)}.stat-card:hover{box-shadow:var(--shadow2);transform:translateY(-1px)}
.stat-card .sn{font-size:32px;font-weight:800;color:var(--pri)}
.stat-card .sl{font-size:12px;color:var(--txt2);margin-top:2px}
/* API config */
.api-cfg{background:var(--card);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--border);border-radius:var(--radius);padding:16px 20px;margin-bottom:16px;box-shadow:var(--shadow)}
.api-cfg summary{font-size:14px;font-weight:700;color:var(--pri);cursor:pointer;padding:2px 0;user-select:none}
.api-cfg summary:hover{opacity:0.8}
.api-cfg .cfg-row{display:flex;gap:10px;margin-top:10px;flex-wrap:wrap;align-items:flex-end}
.api-cfg .cfg-f{display:flex;flex-direction:column;gap:4px;flex:1;min-width:110px}
.api-cfg .cfg-f label{font-size:11px;color:var(--txt2);font-weight:700}
.api-cfg .cfg-f input,.api-cfg .cfg-f select{padding:7px 10px;border:1px solid var(--border);border-radius:6px;font-size:13px;font-family:var(--font);background:var(--bg);color:var(--txt);outline:none}
.api-cfg .cfg-f input:focus,.api-cfg .cfg-f select:focus{border-color:var(--pri)}
.api-status{font-size:11px;padding:3px 10px;border-radius:10px;display:inline-block;margin-left:8px;font-weight:600}
.api-status.ok{background:rgba(54,211,153,0.12);color:#1F9D6F}
.api-status.err{background:rgba(248,114,114,0.12);color:#D14343}
/* Toast */
.toast{position:fixed;top:20px;left:50%;transform:translateX(-50%);background:var(--card);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);color:var(--txt);padding:10px 24px;border-radius:20px;font-size:13px;z-index:999;opacity:0;transition:opacity var(--trans);pointer-events:none;font-weight:500;box-shadow:var(--shadow2);max-width:90vw;text-align:center;border:1px solid var(--border)}
.toast.show{opacity:1}
/* Loader */
.loader{display:flex;align-items:center;justify-content:center;gap:10px;padding:36px;color:var(--txt2);font-size:14px}
.spinner{width:24px;height:24px;border:2.5px solid transparent;border-top:2.5px solid var(--pri);border-right:2.5px solid var(--suc);border-radius:50%;animation:spin 0.7s linear infinite}
.loader .spinner{width:32px;height:32px;border-width:3px;border-top-color:var(--pri);border-right-color:var(--suc);border-bottom-color:var(--warn);border-left-color:var(--err)}
@keyframes spin{to{transform:rotate(360deg)}}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
@keyframes slideUp{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:translateY(0)}}
/* Speed toggle */
.speed-tg{display:inline-flex;align-items:center;gap:5px;cursor:pointer;font-size:12px;font-weight:600;color:var(--txt2);padding:5px 12px;border:1.5px solid var(--border);border-radius:16px;background:var(--card);transition:all var(--trans);user-select:none}
.speed-tg:hover{border-color:var(--pri)}
.speed-tg.on{background:var(--pri);color:#fff;border-color:var(--pri)}
.speed-tg .dot{width:7px;height:7px;border-radius:50%;background:var(--suc)}
/* Timer */
.timer{font-size:18px;font-weight:700;color:var(--err);font-family:'SF Mono','Consolas',monospace}
.timer.warn{animation:pulse 1s infinite}
@keyframes pulse{0%,100%{opacity:1}50%{opacity:0.5}}
/* Empty state */
.empty{padding:60px 20px;text-align:center;color:var(--txt2)}
.empty .empty-icon{font-size:48px;margin-bottom:12px}
/* Mobile */
.menu-btn{display:none;background:none;border:none;font-size:22px;cursor:pointer;color:var(--txt);padding:4px}
/* Bottom nav (mobile) */
.bottom-nav{display:none;position:fixed;bottom:0;left:0;right:0;height:56px;background:var(--card);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border-top:1px solid var(--border);z-index:40;justify-content:space-around;align-items:center;padding:0 4px;padding-bottom:env(safe-area-inset-bottom,0)}
.bottom-nav .bn-item{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:48px;min-height:48px;border:none;background:none;color:var(--txt2);font-size:10px;font-family:var(--font);cursor:pointer;transition:all var(--trans);border-radius:8px;padding:4px 8px}
.bottom-nav .bn-item.active,.bottom-nav .bn-item:active{color:var(--pri)}
.bottom-nav .bn-item .bn-icon{font-size:20px;line-height:1}
/* Mobile drawer */
.mobile-drawer{display:none;position:fixed;inset:0;z-index:60;pointer-events:none}
.mobile-drawer.open{pointer-events:auto}
.mobile-drawer .md-backdrop{position:absolute;inset:0;background:rgba(0,0,0,0.4);opacity:0;transition:opacity 0.25s}
.mobile-drawer.open .md-backdrop{opacity:1}
.mobile-drawer .md-panel{position:absolute;left:0;top:0;bottom:0;width:85vw;max-width:320px;background:var(--card);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);transform:translateX(-100%);transition:transform 0.25s cubic-bezier(0.4,0,0.2,1);overflow-y:auto;display:flex;flex-direction:column;box-shadow:4px 0 24px rgba(0,0,0,0.15)}
.mobile-drawer.open .md-panel{transform:translateX(0)}
.mobile-drawer .md-header{padding:16px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between}
.mobile-drawer .md-header .md-title{font-size:15px;font-weight:700;color:var(--pri)}
.mobile-drawer .md-close{position:absolute;top:16px;right:16px;width:48px;height:48px;border:none;background:rgba(0,0,0,0.25);border-radius:50%;font-size:24px;cursor:pointer;color:#fff;display:flex;align-items:center;justify-content:center;z-index:10;transition:background 0.2s;-webkit-tap-highlight-color:transparent}
.mobile-drawer .md-close:active{background:rgba(0,0,0,0.45)}
.mobile-drawer .md-body{flex:1;overflow-y:auto;padding:8px}
/* Math symbol bar */
.math-bar{display:none;gap:4px;flex-wrap:wrap;padding:6px 0;margin-bottom:8px}
.math-bar .math-chip{padding:6px 12px;border:1px solid var(--border);border-radius:14px;background:var(--bg);color:var(--pri);font-size:14px;cursor:pointer;font-family:var(--font);min-width:36px;text-align:center;transition:all var(--trans);user-select:none}
.math-bar .math-chip:active{background:var(--pri);color:#fff}
/* Blue light filter */
body.bluelight{filter:sepia(0.15) saturate(0.7) hue-rotate(170deg) brightness(0.9)}
/* Swipe area */
.swipe-zone{touch-action:pan-y;user-select:none;-webkit-user-select:none}
/* Mobile timer */
.mobile-timer{display:none;font-size:12px;color:var(--txt2);font-weight:600;padding:2px 8px;background:var(--bg2);border-radius:10px}

/* Floating menu button (mobile only) */
.float-menu-btn{display:none;position:fixed;top:16px;left:16px;width:48px;height:48px;border:none;background:rgba(22,93,255,0.88);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-radius:50%;font-size:22px;cursor:pointer;color:#fff;z-index:45;align-items:center;justify-content:center;box-shadow:0 4px 16px rgba(22,93,255,0.35);transition:all var(--trans);-webkit-tap-highlight-color:transparent}
.float-menu-btn:active{background:rgba(22,93,255,1);transform:scale(0.94)}/* PWA standalone */
@media(display-mode:standalone){.bottom-nav{padding-bottom:12px}}
@media(max-width:768px){
  /* Layout */
  .app{flex-direction:column}
  .sidebar{position:fixed;left:0;top:0;height:100vh;transform:translateX(-100%);z-index:50;width:75vw;max-width:300px;transition:transform var(--trans)}

  .sidebar-backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,0.4);z-index:49;transition:opacity 0.25s}
  .sidebar-backdrop.show{display:block}
  .main{height:100vh;padding-bottom:56px}
  .topbar{padding:10px 14px;gap:6px}
  .topbar h1{font-size:15px}
  .topbar .tb-badge{font-size:10px;padding:2px 8px}
  .topbar .speed-tg{font-size:10px;padding:3px 8px}
  .menu-btn{display:flex;align-items:center;justify-content:center;min-width:40px;min-height:40px}
  .float-menu-btn{display:flex}
  .main-content{padding:12px;padding-bottom:16px}
  .card{padding:16px}
  .card+.card{margin-top:12px}
  /* Bottom nav */
  .bottom-nav{display:flex}
  /* Mobile drawer */
  .mobile-drawer{display:block}
  /* Touch targets */
  .opt{padding:14px 16px;min-height:56px;border-radius:12px;align-items:center;font-size:14px}
  .opt-lbl{font-size:15px;min-width:28px}
  .fill-inp{height:56px;font-size:16px;padding:12px}
  .btn{padding:12px 20px;font-size:14px;min-height:44px}
  .btn-sm{padding:8px 14px;font-size:12px;min-height:36px}
  .btn-row{gap:12px}
  /* Math bar */
  .math-bar{display:flex}
  /* Timer */
  .mobile-timer{display:inline-block}
  /* Onboarding */
  .onboard-card{padding:24px;margin:12px;max-width:100%}
  .onboard-card h2{font-size:19px}
  .ob-grid.cols2,.ob-grid.cols3{grid-template-columns:1fr}
  .ob-opt{padding:12px;min-height:48px;font-size:13px}
  /* Batch tabs */
  .batch-tab{padding:8px 12px;font-size:11px;min-height:36px}
  /* Stats */
  .stats-grid{grid-template-columns:1fr 1fr;gap:8px}
  .stat-card{padding:12px}
  .stat-card .sn{font-size:24px}
  /* Sidebar footer - hide on mobile (moved to bottom nav) */
  .sidebar-footer{display:none}
  /* Hide desktop-only elements */
  .topbar .btn-ghost{display:none}
  /* Swipe info */
  .swipe-hint{font-size:10px;color:var(--txt2);text-align:center;margin-top:8px}
  /* API config */
  .api-cfg{padding:12px}
  .api-cfg .cfg-row{flex-direction:column;gap:8px}
  .api-cfg .cfg-f{min-width:100%!important}
  /* Diff row */
  .diff-row{gap:4px}
  .diff-btn{padding:6px 12px;font-size:11px;min-height:36px}
  /* Question body */
  .q-body{font-size:14px;line-height:1.8}
  /* Result box */
  .result{padding:12px}
  /* Graphic box */
  .gfx-box{padding:8px}
  /* Landscape mode - show sidebar */
  @media(orientation:landscape){
    .main{padding-bottom:0}
    .bottom-nav{display:none}
    .sidebar{width:260px;min-width:260px}
    .mobile-timer{display:none}
  }
}
</style>

function questionFingerprint(qText){
  // Generate a simplified fingerprint: keep only LaTeX formulas and key Chinese characters
  let s=qText||'';
  // Extract LaTeX formulas as is
  let latex=s.match(/\$[^\$]+\$/g)||[];
  // Remove numbers and punctuation, keep Chinese chars and LaTeX
  let clean=s.replace(/\$[^\$]+\$/g,'').replace(/[\d\s\.\,\;\:\!\?\(\)\-\+\=<>]/g,'');
  return (latex.join('')+clean.substring(0,60)).replace(/\s/g,'');
}

function isDuplicate(pointId,qText){
  if(!pointId||!qText)return false;
  const h=getDedupHistory();
  const list=h[pointId]||[];
  const fp=questionFingerprint(qText);
  if(!fp)return false;
  const cutoff=Date.now()-30*24*3600*1000;
  // Check against recent entries (last 30 days)
  for(const entry of list){
    if(entry.date<cutoff)continue;
    const dist=levenshteinDistance(fp,entry.fingerprint);
    // If similarity > 85%, treat as duplicate
    const maxLen=Math.max(fp.length,entry.fingerprint.length);
    if(maxLen>0&&(1-dist/maxLen)>0.85)return true;
  }
  return false;
}

function addToDedupHistory(pointId,qText){
  if(!pointId||!qText)return;
  const h=getDedupHistory();
  if(!h[pointId])h[pointId]=[];
  const fp=questionFingerprint(qText);
  if(!fp)return;
  h[pointId].push({fingerprint:fp,date:Date.now()});
  // Keep only last 200 entries per point
  if(h[pointId].length>200)h[pointId]=h[pointId].slice(-200);
  // Clean old entries
  const cutoff=Date.now()-60*24*3600*1000;
  h[pointId]=h[pointId].filter(e=>e.date>cutoff);
  dedupHistory=h;
  saveDedupHistory();
}

function hasAvailableQuestions(pointId){
  // Check if there are template questions still unused for this point
  const pt=findPointById(pointId);
  if(!pt)return true;
  if(pt.tpl&&pt.tpl.length){
    const key=pointId;
    if(!tplUsed[key])tplUsed[key]=[];
    if(tplUsed[key].length<pt.tpl.length)return true;
  }
  // Check dedup count in last 7 days
  const h=getDedupHistory();
  const list=h[pointId]||[];
  const weekAgo=Date.now()-7*24*3600*1000;
  const recentCount=list.filter(e=>e.date>weekAgo).length;
  if(recentCount>=30)return false; // More than 30 unique questions in a week = enough
  return true;
}

function levenshteinDistance(a,b){
  if(!a||!b)return 0;
  const m=a.length,n=b.length;
  const dp=Array.from({length:m+1},()=>Array(n+1).fill(0));
  for(let i=0;i<=m;i++)dp[i][0]=i;
  for(let j=0;j<=n;j++)dp[0][j]=j;
  for(let i=1;i<=m;i++)for(let j=1;j<=n;j++)dp[i][j]=Math.min(dp[i-1][j]+1,dp[i][j-1]+1,dp[i-1][j-1]+(a[i-1]===b[j-1]?0:1));
  return dp[m][n];
}

function diagnoseError(status,bodyText){
  const b=(bodyText||'').toLowerCase();
  if(status===401)return 'API Key 无效或已过期';
  if(status===403)return 'API Key 无权限访问该模型';
  if(status===402||b.includes('quota')||b.includes('insufficient'))return 'API 额度不足，请检查账户余额';
  if(status===429)return '请求频繁，请稍后重试';
  if(status===404)return 'API 地址不存在（404）';
  if(status>=500)return '服务器内部错误（'+status+'），请稍后重试';
  if(status===0||!status)return '网络连接失败，请检查网络';
  return `API请求失败 (HTTP ${status})`;
}

// ==================== JSON解析与修复 ====================
function extractJSON(text){
  if(!text||typeof text!=='string')return null;
  text=text.trim();
  try{JSON.parse(text);return text}catch(e){}
  let m=text.match(/```(?:json)?\s*([\s\S]*?)```/);
  if(m){try{JSON.parse(m[1].trim());return m[1].trim()}catch(e){}}
  let depth=0,start=-1,end=-1;
  for(let i=0;i<text.length;i++){
    if(text[i]==='{'){if(depth===0)start=i;depth++}
    else if(text[i]==='}'){depth--;if(depth===0){end=i;break}}
  }
  if(start>=0&&end>start){let inner=text.substring(start,end+1);try{JSON.parse(inner);return inner}catch(e){return inner}}
  return null;
}
function repairJSON(jsonStr){
  if(!jsonStr)return null;
  let s=jsonStr.trim().replace(/^[﻿]+/,'').replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'');
  s=s.replace(/\/\/.*$/gm,'').replace(/\/\*[\s\S]*?\*\//g,'');
  s=s.replace(/,(\s*[}\]])/g,'$1');
  s=s.replace(/([{,]\s*)([a-zA-Z_一-龥][a-zA-Z0-9_一-龥]*)\s*:/g,'$1"$2":');
  return s;
}
function robustParseJSON(text){
  try{return JSON.parse(text)}catch(e){}
  let extracted=extractJSON(text);
  if(extracted){
    try{return JSON.parse(extracted)}catch(e){}
    let repaired=repairJSON(extracted);
    if(repaired&&repaired!==extracted){try{return JSON.parse(repaired)}catch(e){}}
    throw new Error('JSON格式异常：AI返回数据无法解析。\n预览：'+extracted.substring(0,200));
  }
  throw new Error('JSON提取失败：未找到有效JSON。\n预览：'+(text||'').substring(0,200));
}

// ==================== API调用 ====================
async function callClaudeAPI(sys,usr,cfg,retries){
  let lastErr=null;
  for(let a=1;a<=retries;a++){
    try{
      const resp=await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'application/json','x-api-key':cfg.key,'anthropic-version':'2023-06-01'},body:JSON.stringify({model:cfg.model,max_tokens:cfg.maxTokens,temperature:cfg.temperature,system:sys,messages:[{role:'user',content:usr}]}),signal:AbortSignal.timeout(90000)});
      if(!resp.ok){const t=await resp.text();let m='';try{m=JSON.parse(t).error?.message||t}catch(e){m=t};throw new Error(diagnoseError(resp.status,m))}
      const d=await resp.json();let c='';if(d.content&&Array.isArray(d.content)){for(const b of d.content)if(b.type==='text')c+=b.text}
      if(!c)throw new Error('Claude返回格式异常');
      return c;
    }catch(e){lastErr=e;if(a<retries){await new Promise(r=>setTimeout(r,Math.min(1000*Math.pow(2,a-1),4000)))}}
  }
  throw lastErr||new Error('Claude调用失败');
}
async function callOpenAIAPI(sys,usr,cfg,retries){
  const body={model:cfg.model,messages:[{role:'system',content:sys},{role:'user',content:usr}],max_tokens:cfg.maxTokens,temperature:cfg.temperature};
  if(cfg.model.startsWith('gpt-')||cfg.model.startsWith('deepseek'))body.response_format={type:'json_object'};
  let lastErr=null;
  for(let a=1;a<=retries;a++){
    try{
      const resp=await fetch(cfg.url,{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${cfg.key}`},body:JSON.stringify(body),signal:AbortSignal.timeout(60000)});
      if(!resp.ok){const t=await resp.text();throw new Error(diagnoseError(resp.status,t))}
      const d=await resp.json();let c=d.choices?.[0]?.message?.content;
      if(!c){if(d.content)c=d.content;else if(d.result)c=d.result;else if(d.msg)c=d.msg;else throw new Error('API返回格式异常')}
      if(typeof c!=='string')c=JSON.stringify(c);
      return c;
    }catch(e){lastErr=e;if(a<retries){await new Promise(r=>setTimeout(r,Math.min(1000*Math.pow(2,a-1),4000)))}}
  }
  throw lastErr||new Error('API调用失败');
}
async function callAPI(sys,usr,retries=3){
  const cfg=getApiConfig();if(!cfg.key)throw new Error('API_KEY_MISSING');
  return cfg.modelType==='claude'?callClaudeAPI(sys,usr,cfg,retries):callOpenAIAPI(sys,usr,cfg,retries);
}

function buildUserPrompt(chapterName,pointName,difficulty,qType,kw,retryCount,isRealExam,realSrc){
  const dm={easy:'基础题',medium:'中档题',hard:'难题'};
  let p=`生成一道${dm[difficulty]}，章节：${chapterName}`;
  if(pointName)p+=` > ${pointName}`;
  if(kw)p+=`，知识点：${kw}`;
  p+=`，题型：${qType==='choice'?'选择题（4选项单选）':(qType==='fill'?'填空题':'解答题（2-3小问）')}`;
  if(qType==='choice')p+=`，难度≈北京卷${difficulty==='easy'?'1-8':(difficulty==='medium'?'9-10':'11-12')}题`;
  if(isRealExam&&realSrc)p+=`\n本题来自/模仿：${realSrc}`;
  if(retryCount>0)p+=`\n\n【重试#${retryCount}】上次JSON格式错误！必须只输出一行有效JSON。`;
  p+=`\n\n仅输出JSON。`;
  return p;
}

// ==================== 解析AI响应 ====================
function parseQuestionResponse(text){
  const q=robustParseJSON(text);
  if(!q.question||!q.type)throw new Error('题目格式不完整');
  if(q.type==='choice'){
    if(!q.options||!Array.isArray(q.options))throw new Error('选择题需options数组');
    while(q.options.length<4)q.options.push('');
    if(typeof q.answer!=='number'||q.answer<0||q.answer>3){
      const ai=parseInt(q.answer);if(!isNaN(ai)&&ai>=0&&ai<=3)q.answer=ai;
      else{const lm={'A':0,'B':1,'C':2,'D':3};const k=String(q.answer).trim().toUpperCase();q.answer=lm[k]!==undefined?lm[k]:0}
    }
  }
  if(q.graphic&&q.graphic.trim()){
    let g=q.graphic.trim();
    if(g.includes('<svg')&&g.includes("'"))g=g.replace(/'/g,'"');
    if(g.startsWith('<svg'))q._graphicSvg=g;
    else{let m=g.match(/<svg[\s\S]*?<\/svg>/i);if(m)q._graphicSvg=m[0];else q._graphicDesc=g}
  }
  if(!q._graphicSvg&&q.explanation){
    let m=q.explanation.match(/```svg\s*([\s\S]*?)```/);
    if(!m)m=q.explanation.match(/<svg[\s\S]*?<\/svg>/i);
    if(m){q._graphicSvg=m[1]||m[0];q.explanation=q.explanation.replace(/```svg[\s\S]*?```/,'').replace(/<svg[\s\S]*?<\/svg>/i,'').trim()}
  }
  if(!q.knowledge||!Array.isArray(q.knowledge))q.knowledge=[];
  return q;
}

// ==================== 模板题管理 ====================
function getTemplateQuestion(pointId){
  const pt=findPointById(pointId);if(!pt||!pt.tpl||!pt.tpl.length)return null;
  const key=pointId;if(!tplUsed[key])tplUsed[key]=[];
  const used=tplUsed[key];
  // 找第一个未使用的模板
  for(let i=0;i<pt.tpl.length;i++){if(!used.includes(i)){used.push(i);localStorage.setItem('bjm_tpl_used',JSON.stringify(tplUsed));return pt.tpl[i]}}
  return null; // 全部用过了
}

// ==================== 题目生成 ====================
function pickQuestionType(){
  const cfg=GRADE_CONFIG[userGrade];const goal=cfg?.goals[userGoal];
  if(userGoal==='real')return Math.random()<0.4?'choice':(Math.random()<0.7?'fill':'solve');
  if(curChapter&&curChapter.startsWith('exam-'))return curChapter==='exam-fb'?'fill':(curChapter==='exam-sa'?'solve':(curChapter==='exam-mc'?'choice':'exam'));
  const r=Math.random();
  if(userGoal==='sync'||userGoal==='academic')return r<0.55?'choice':(r<0.9?'fill':'solve');
  if(userGoal==='round2')return r<0.35?'choice':(r<0.65?'fill':'solve');
  return r<0.5?'choice':(r<0.8?'fill':'solve');
}

async function generateQuestion(){
  if(!curChapter){renderWelcome();return}
  if(isLoading)return;
  batchSize=parseInt($('batchCount')?.value||'1');
  if(batchSize>1){await generateBatch();return}
  // 尝试模板题（含去重检查）
  if(curPoint&&batchSize===1&&speedMode===false){
    const tpl=getTemplateQuestion(curPoint);
    if(tpl){
      if(isDuplicate(curPoint,tpl.q)){
        const key=curPoint;if(tplUsed[key]){const idx=tplUsed[key].lastIndexOf(tplUsed[key].length-1);if(idx>=0)tplUsed[key].splice(idx,1)}localStorage.setItem('bjm_tpl_used',JSON.stringify(tplUsed));
      }else{
        addToDedupHistory(curPoint,tpl.q);
        curQ={question:tpl.q,type:tpl.t,options:tpl.opt||null,answer:tpl.a,explanation:tpl.exp||'',knowledge:[getPointName(curPoint)],_genType:tpl.t,_fromTpl:true};isLoading=false;submitted=false;selectedOpt=null;userFill='';fillIsCorrect=false;batchQuestions=[];renderQuestion();return
      }
    }
  }
  isLoading=true;submitted=false;selectedOpt=null;userFill='';fillIsCorrect=false;batchQuestions=[];
  renderLoadingSingle();
  const qType=pickQuestionType();
  try{
    const pt=curPoint?findPointById(curPoint):null;
    const chName=getChapterName(curChapter);
    const pn=pt?pt.name:'';
    const includeGraphic=GEOMETRY_IDS.includes(curChapter);
    const isReal=userGoal==='real';
    let realSrc='';if(isReal)realSrc=EXAM_SOURCES[Math.floor(Math.random()*EXAM_SOURCES.length)];
    let respText=null;
    for(let retry=0;retry<3;retry++){
      try{
        const sys=buildSystemPrompt(includeGraphic,isReal);
        const usr=buildUserPrompt(chName,pn,curDiff,qType,pt?pt.kw:'',retry,isReal,realSrc);
        respText=await callAPI(sys,usr);
        if(!respText)continue;
        curQ=parseQuestionResponse(respText);curQ._genType=qType;curQ._fromTpl=false;
        // Dedup check
        if(curPoint&&isDuplicate(curPoint,curQ.question)){
          if(retry<2)continue; // Retry for non-duplicate
        }
        break;
      }catch(e){if(e.message&&e.message.includes('JSON'))continue;throw e}
    }
    if(!curQ)throw new Error('题目生成失败：多次重试后仍无法解析JSON');
    if(curPoint&&curQ.question)addToDedupHistory(curPoint,curQ.question);
    isLoading=false;renderQuestion();
  }catch(e){isLoading=false;renderError(e.message)}
}

// ==================== 批量生成（串行，故障隔离）====================
async function generateBatch(){
  isLoading=true;batchQuestions=[];batchIdx=0;
  const qType=pickQuestionType();
  if(qType==='exam'){await generateFullExam();return}
  for(let i=0;i<batchSize;i++)batchQuestions.push({_idx:i,_status:'loading',_genType:qType});
  renderBatchProgress();

  const pt=curPoint?findPointById(curPoint):null;
  const chName=getChapterName(curChapter);
  const pn=pt?pt.name:'';
  const includeGraphic=GEOMETRY_IDS.includes(curChapter);
  const isReal=userGoal==='real';

  for(let i=0;i<batchSize;i++){
    // 先尝试模板题（含去重）
    if(pt&&pt.tpl&&i<pt.tpl.length){
      const tpl=pt.tpl[i];
      if(!isDuplicate(curPoint,tpl.q)){
        addToDedupHistory(curPoint,tpl.q);
        batchQuestions[i]={_idx:i,_status:'ready',_genType:qType,question:tpl.q,type:tpl.t,options:tpl.opt||null,answer:tpl.a,explanation:tpl.exp||'',knowledge:[pn],_fromTpl:true};
        updateBatchProgress(i+1,batchSize,'done');continue;
      }
      // Skip duplicate, try next template or fall through to AI
    }
    updateBatchProgress(i,batchSize,'generating');
    try{
      let respText=null,parsed=null;
      for(let retry=0;retry<2;retry++){
        try{
          let realSrc='';if(isReal)realSrc=EXAM_SOURCES[Math.floor(Math.random()*EXAM_SOURCES.length)];
          const sys=buildSystemPrompt(includeGraphic,isReal);
          const usr=buildUserPrompt(chName,pn,curDiff,qType,pt?pt.kw:'',retry,isReal,realSrc);
          respText=await callAPI(sys,usr,2);
          if(!respText)continue;
          parsed=parseQuestionResponse(respText);break;
        }catch(e){if(e.message&&e.message.includes('JSON'))continue;throw e}
      }
      if(parsed){parsed._idx=i;parsed._genType=qType;parsed._status='ready';batchQuestions[i]=parsed;if(curPoint&&parsed.question)addToDedupHistory(curPoint,parsed.question)}
      else{batchQuestions[i]={_idx:i,_status:'error',_msg:'JSON解析失败',_genType:qType}}
    }catch(e){batchQuestions[i]={_idx:i,_status:'error',_msg:e.message,_genType:qType}}
    updateBatchProgress(i+1,batchSize,'done');
  }
  isLoading=false;
  if(!batchQuestions.some(q=>q._status==='ready')){renderError('全部题目生成失败');return}
  renderBatchQuestions();
}

function renderBatchProgress(){
  const chName=getChapterName(curChapter);
  let h=renderApiConfig();
  h+=`<div class="topbar2" style="margin-bottom:16px"><h2 style="font-size:16px">${chName}（批量×${batchSize}）</h2></div>`;
  h+=`<div class="card"><div class="loader"><div class="spinner"></div><span id="batchStatus">正在生成 0/${batchSize}...</span></div><div class="prog-bar"><div class="prog-bar-fill" id="batchProgBar" style="width:0%"></div></div></div>`;
  $('mainContent').innerHTML=h;
}
function updateBatchProgress(done,total,phase){
  const bar=$('batchProgBar');if(bar)bar.style.width=(done/total*100)+'%';
  const st=$('batchStatus');if(st)st.textContent=phase==='generating'?`正在生成第 ${done+1}/${total} 题...`:`已完成 ${done}/${total} 题`;
}

async function retryBatchQuestion(idx){
  if(isLoading)return;
  const q=batchQuestions[idx];if(!q||q._status==='ready'||q._status==='loading')return;
  isLoading=true;
  batchQuestions[idx]={_idx:idx,_status:'loading',_genType:q._genType||pickQuestionType()};
  renderBatchQuestions();
  const pt=curPoint?findPointById(curPoint):null;
  const chName=getChapterName(curChapter);
  try{
    let respText=null,parsed=null;
    for(let retry=0;retry<2;retry++){
      try{
        const sys=buildSystemPrompt(GEOMETRY_IDS.includes(curChapter),userGoal==='real');
        const usr=buildUserPrompt(chName,pt?pt.name:'',curDiff,batchQuestions[idx]._genType,pt?pt.kw:'',retry,userGoal==='real','');
        respText=await callAPI(sys,usr,2);
        if(!respText)continue;
        parsed=parseQuestionResponse(respText);break;
      }catch(e){if(e.message&&e.message.includes('JSON'))continue;throw e}
    }
    if(parsed){parsed._idx=idx;parsed._genType=batchQuestions[idx]._genType;parsed._status='ready';batchQuestions[idx]=parsed}
    else{batchQuestions[idx]={_idx:idx,_status:'error',_msg:'重试失败：JSON解析异常',_genType:batchQuestions[idx]._genType}}
  }catch(e){batchQuestions[idx]={_idx:idx,_status:'error',_msg:e.message,_genType:batchQuestions[idx]._genType}}
  isLoading=false;renderBatchQuestions();
}

async function generateFullExam(){
  isLoading=true;renderLoading('正在生成完整模拟试卷（约需30-60秒）...');
  const ep=`生成一套完整北京高考数学模拟试卷（150分/120分钟）。
结构：一、选择题10题（各4分），二、填空题5题（各5分），三、解答题6题（共85分）：16三角/数列13分，17立体几何14分，18概率统计14分，19解析几何14分，20导数15分，21压轴创新15分。
贴合北京卷风格。输出JSON：{"type":"exam","title":"北京市高考数学模拟试卷","time":"120分钟","score":"150分","sections":[{"name":"一、选择题","questions":[{"question":"...","type":"choice","options":["A","B","C","D"],"answer":0,"explanation":"...","knowledge":["..."],"difficulty":"easy"},...10题]},{"name":"二、填空题","questions":[{"question":"...","type":"fill","answer":"答案","explanation":"...","knowledge":["..."],"difficulty":"easy"},...5题]},{"name":"三、解答题","questions":[{"question":"...","type":"solve","answer":"见解析","explanation":"...","knowledge":["..."],"difficulty":"medium"},...6题]}]}`;
  try{
    let res=null,parsed=null;
    for(let r=0;r<2;r++){try{res=await callAPI(buildSystemPrompt(false,false),ep,2);if(res){parsed=parseQuestionResponse(res);break}}catch(e){if(e.message&&e.message.includes('JSON'))continue;throw e}}
    if(!parsed)throw new Error('试卷生成失败');
    curQ=parsed;examSeconds=120*60;curQ._examAnswers={};curQ._examSubmitted={};curQ._examCorrect={};
    startExamTimer();isLoading=false;renderExamPage();
  }catch(e){isLoading=false;renderError(`试卷生成失败: ${e.message}`)}
}

// ==================== 侧边栏渲染 ====================
function renderSidebar(){
  const nav=$('sidebarNav');
  const gradeFilter=userGrade;
  const stats=getStats();
  let h='';
  KNOWLEDGE_TREE.forEach(tb=>{
    if(tb.grade>gradeFilter&&userGoal!=='round1'&&userGoal!=='round2'&&userGoal!=='round3'&&userGoal!=='real')return;
    const collapsed=localStorage.getItem('bjm_tree_'+tb.textbook)==='0';
    h+=`<div class="tree-group"><div class="tree-group-title${collapsed?' collapsed':''}" onclick="toggleTreeGroup(this,'${tb.textbook}')">${tb.textbook}<span class="arr">▼</span></div>`;
    h+=`<div class="tree-children" style="${collapsed?'display:none':''}">`;
    tb.chapters.forEach(ch=>{
      // 新课同步模式下过滤：仅显示当前年级的章节
      if(userGoal==='sync'&&tb.grade!==gradeFilter)return;
      const chStat=stats[ch.id];const rate=chStat&&chStat.total?Math.round(chStat.correct/chStat.total*100):-1;
      let mTag='';if(rate>=80)mTag='<span class="ch-mastery good">优</span>';
      else if(rate>=60)mTag='<span class="ch-mastery mid">良</span>';
      else if(rate>=0)mTag='<span class="ch-mastery weak">弱</span>';
      h+=`<div class="tree-chapter${curChapter===ch.id?' active':''}" onclick="selectChapter('${ch.id}')" title="${ch.name}">${ch.name}${mTag}</div>`;
      // 展开单元和考点
      if(curChapter===ch.id){
        ch.units.forEach(u=>{
          u.points.forEach(p=>{
            const pStat=stats[p.id];const pRate=pStat&&pStat.total?Math.round(pStat.correct/pStat.total*100):-1;
            let pmTag='';if(pRate>=80)pmTag='<span class="ch-mastery good">优</span>';
            else if(pRate>=60)pmTag='<span class="ch-mastery mid">良</span>';
            else if(pRate>=0)pmTag='<span class="ch-mastery weak">弱</span>';
            h+=`<div class="tree-unit${curPoint===p.id?' active':''}" onclick="event.stopPropagation();selectPoint('${ch.id}','${p.id}')" title="考频:${p.freq} | 难度:${['','基础','中档','难题'][p.diff]}">${p.name} <small style="color:var(--txt2)">${p.freq}</small>${pmTag}</div>`;
          });
        });
      }
    });
    h+=`</div></div>`;
  });
  // 高考综合专题（高三专用）
  if(userGrade>=3||userGoal==='round2'||userGoal==='real'){
    h+=`<div class="tree-group"><div class="tree-group-title" onclick="toggleTreeGroup(this,'exam')">高考综合专题<span class="arr">▼</span></div><div class="tree-children">`;
    EXAM_TOPICS.forEach(t=>{
      h+=`<div class="tree-chapter${curChapter===t.id?' active':''}" onclick="selectChapter('${t.id}')">${t.name}<br><small style="color:var(--txt2)">${t.desc}</small></div>`;
    });
    h+=`<div class="tree-chapter${(curChapter||'').startsWith('exam-')?' active':''}" onclick="selectChapter('exam-full')">📝 完整模拟卷</div>`;
    h+=`</div></div>`;
  }
  nav.innerHTML=h;
}
function toggleTreeGroup(el,name){
  el.classList.toggle('collapsed');
  const children=el.nextElementSibling;
  children.style.display=children.style.display==='none'?'block':'none';
  localStorage.setItem('bjm_tree_'+name,children.style.display==='none'?'0':'1');
}

function renderQuestion(){

function renderDiffRow(){

function renderQCard(q,genType,isSub,selOpt,uFill,fCorrect,isBatch){
  if(genType==='choice'||q.type==='choice')return renderChoiceCard(q,isSub,selOpt,isBatch);
  if(genType==='fill'||q.type==='fill')return renderFillCard(q,isSub,uFill,fCorrect,isBatch);
  return renderSolveCard(q,isBatch);
}

function renderChoiceCard(q,isSub,selOpt,isBatch){
  const L='ABCD';let o='';
  q.options.forEach((opt,i)=>{
    let c='opt';if(isSub){c+=' disabled';if(i===q.answer)c+=' correct';else if(i===selOpt&&i!==q.answer)c+=' wrong'}
    else if(i===selOpt)c+=' sel';
    o+=`<div class="${c}" onclick="selOpt(${i})"><span class="opt-lbl">${L[i]}</span><span>${opt}</span></div>`;
  });
  const diffLabel={easy:'基础',medium:'中档',hard:'难题'};
  let card=`<div class="card"><div class="q-header"><span class="q-tag ${curDiff}">${diffLabel[curDiff]}</span><span style="font-size:12px;color:var(--txt2)">AI生成${isBatch?' #'+(q._idx+1):''}${q._fromTpl?' · 典型母题':''}</span></div>
    <div class="q-body">${q.question}</div><div class="options">${o}</div>
    <div class="btn-row"><button class="btn btn-pri" onclick="${isBatch?`submitBatchChoice(${q._idx})`:'submitChoice()'}" ${isSub?'disabled':''}>提交答案</button>
    ${isBatch?'':`<button class="btn btn-ghost btn-sm" onclick="generateQuestion()" ${isLoading?'disabled':''}>生成新题</button>`}</div>`;
  if(isSub){
    const correct=selOpt===q.answer;
    card+=renderResultBox(q,correct,selOpt!==undefined?L[selOpt]:'',isBatch);
  }
  card+=`</div>`;
  if(!isBatch)card+=renderGraphic(q);
  return card;
}

function renderFillCard(q,isSub,uFill,fCorrect,isBatch){

  let card=`<div class="card"><div class="q-header"><span class="q-tag ${curDiff}">${diffLabel[curDiff]}</span><span style="font-size:12px;color:var(--txt2)">AI生成${isBatch?' #'+(q._idx+1):''}${q._fromTpl?' · 典型母题':''}</span></div>
    <div class="q-body">${q.question}</div>

    <input class="fill-inp" id="fillAnswer${isBatch?q._idx:''}" placeholder="请输入答案" ${isSub?'disabled':''} value="${isSub?uFill:''}">
    <div class="btn-row"><button class="btn btn-pri" onclick="${isBatch?`submitBatchFill(${q._idx})`:'submitFill()'}" ${isSub?'disabled':''}>提交答案</button>
    ${isBatch?'':`<button class="btn btn-ghost btn-sm" onclick="generateQuestion()" ${isLoading?'disabled':''}>生成新题</button>`}</div>`;
  if(isSub)card+=renderResultBox(q,fCorrect,uFill,isBatch);
  card+=`</div>`;
  if(!isBatch)card+=renderGraphic(q);
  return card;
}

function renderSolveCard(q,isBatch){
  let card=`<div class="card"><div class="q-header"><span style="font-size:12px;color:var(--txt2)">解答题${isBatch?' #'+(q._idx+1):''}${q._fromTpl?' · 典型母题':''}</span></div>
    <div class="q-body">${(q.question||'').replace(/\n/g,'<br>')}</div>
    <div class="btn-row"><button class="btn btn-out" onclick="toggleSolveExp(this)" id="btnShowExp${isBatch?q._idx:''}">📖 查看详细解答</button>
    ${isBatch?'':`<button class="btn btn-ghost btn-sm" onclick="generateQuestion()" ${isLoading?'disabled':''}>生成新题</button>`}</div>

  return card;

function renderResultBox(q,correct,userAns,isBatch){
  let r=`<div class="result ${correct?'correct':'wrong'} show"><div class="res-title">${correct?'✅ 正确！':'❌ 错误！'}`;
  if(!correct&&q.answer!==undefined)r+=` 正确答案：${Array.isArray(q.answer)?q.answer.join(','):q.answer}`;
  r+=`</div>`;
  // 知识点标签
  if(q.knowledge&&q.knowledge.length){
    r+=`<div class="res-kw">${q.knowledge.map(k=>`<span>${k}</span>`).join('')}</div>`;
  }
  // 解析
  if(q.explanation){
    r+=`<div class="res-exp">${(q.explanation||'').replace(/\n/g,'<br>')}</div>`;
  }
  r+=`</div>`;
  return r;
}

function renderGraphic(q){

function toggleSolveExp(btn){const id=btn.id.replace('btnShowExp','');const exp=$('solveExp'+id);if(exp){exp.style.display='block';btn.style.display='none'}}

// ==================== 批量渲染 ====================
function renderBatchQuestions(){
  if(batchQuestions.length===0)return;
  const chName=getChapterName(curChapter);const ptName=getPointName(curPoint);
  let h=renderApiConfig();
  h+=`<div style="margin-bottom:14px"><h2 style="font-size:17px">${chName}${ptName?' > '+ptName:''}（批量×${batchQuestions.length}）</h2></div>`;
  h+=`<div style="margin-bottom:14px">${renderDiffRow()}</div>`;
  h+=`<div class="batch-tabs">`;
  batchQuestions.forEach((q,i)=>{
    let cls='batch-tab';if(i===batchIdx)cls+=' active';
    if(q._status==='error')cls+=' err';else if(q._submitted&&q._isCorrect!==undefined)cls+=q._isCorrect?' done':' wrong';
    h+=`<div class="${cls}" onclick="switchBatchTab(${i})">题${i+1}${q._status==='error'?' ❌':(q._submitted?(q._isCorrect?' ✓':' ✗'):(q._status==='loading'?' ⏳':''))}</div>`;
  });
  h+=`</div><button class="btn btn-out btn-sm" onclick="batchSubmitAll()" style="margin-bottom:12px">批量提交全部</button>
    <button class="btn btn-ghost btn-sm" onclick="generateQuestion()" style="margin-left:6px;margin-bottom:12px">🔄 重新生成全部</button>`;

  const q=batchQuestions[batchIdx];
  if(!q||q._status==='loading'){
    h+=`<div class="card"><div class="loader"><div class="spinner"></div><span>正在生成...</span></div></div>`;
  }else if(q._status==='error'){
    h+=`<div class="card" style="text-align:center;padding:30px;border-color:var(--err)"><p style="color:var(--err);font-size:15px">⚠️ 题${batchIdx+1}生成失败</p><p style="font-size:12px;color:var(--txt2);margin:8px 0">${q._msg||'未知错误'}</p><button class="btn btn-pri btn-sm" onclick="retryBatchQuestion(${batchIdx})">🔄 重新生成本题</button></div>`;
  }else{
    const isSub=q._submitted||false,sel=q._selOpt,uF=q._userFill||'',fC=q._isCorrect||false;
    h+=renderQCard(q,q._genType,isSub,sel,uF,fC,true);
    h+=renderGraphic(q);
  }
  $('mainContent').innerHTML=h;refreshMathJax();
}
function switchBatchTab(i){batchIdx=i;renderBatchQuestions()}

function batchSubmitAll(){
  let count=0;
  batchQuestions.forEach((q,i)=>{
    if(!q||q._status!=='ready'||q._submitted)return;
    if(q._genType==='choice'&&q._selOpt!==undefined)submitBatchOne(i);
    else if(q._genType==='fill'&&q._userFill)submitBatchOne(i);
    else if(q._genType==='solve'){q._submitted=true;q._isCorrect=true;saveRecord(true)}
    count++;
  });
  renderBatchQuestions();
  toast(count>0?`已提交 ${count} 道题`:'请先完成题目再提交');
}
function submitBatchOne(i){
  const q=batchQuestions[i];if(!q||q._status!=='ready'||q._submitted)return;
  if(q._genType==='choice'||q.type==='choice'){
    if(q._selOpt===undefined)return;
    q._submitted=true;q._isCorrect=q._selOpt===q.answer;
    saveRecord(q._isCorrect);if(!q._isCorrect)saveError(q,curChapter);
  }else if(q._genType==='fill'||q.type==='fill'){
    if(!q._userFill)return;
    q._submitted=true;const ans=String(q.answer||'').replace(/\s/g,'');
    q._isCorrect=q._userFill.replace(/\s/g,'')===ans||q._userFill.replace(/\s/g,'').toLowerCase()===ans.toLowerCase();
    saveRecord(q._isCorrect);if(!q._isCorrect)saveError(q,curChapter);
  }
}
function submitBatchChoice(i){const q=batchQuestions[i];if(!q||q._submitted||q._selOpt===undefined){toast('请先选择选项');return}submitBatchOne(i);renderBatchQuestions()}
function submitBatchFill(i){const q=batchQuestions[i];if(!q||q._submitted)return;const inp=$('fillAnswer'+i);if(!inp||!inp.value.trim()){toast('请输入答案');return}q._userFill=inp.value.trim();submitBatchOne(i);renderBatchQuestions()}

// ==================== 单题交互 ====================
function selOpt(i){
  if(submitted||(batchQuestions.length>0&&batchQuestions[batchIdx]&&batchQuestions[batchIdx]._submitted))return;
  if(batchQuestions.length>0){batchQuestions[batchIdx]._selOpt=i;renderBatchQuestions()}
  else{selectedOpt=i;document.querySelectorAll('.opt').forEach((e,idx)=>e.classList.toggle('sel',idx===i))}
}
function submitChoice(){
  if(batchQuestions.length>0){submitBatchChoice(batchIdx);return}
  if(selectedOpt===null){toast('请先选择一个选项');return}
  submitted=true;const ok=selectedOpt===curQ.answer;saveRecord(ok);if(!ok)saveError(curQ);renderQuestion();
  setTimeout(()=>{const rb=document.querySelector('.result.show');if(rb)rb.scrollIntoView({behavior:'smooth',block:'center'})},100);
}
function submitFill(){
  if(batchQuestions.length>0){submitBatchFill(batchIdx);return}
  const inp=$('fillAnswer');if(!inp||!inp.value.trim()){toast('请输入答案');return}
  userFill=inp.value.trim();submitted=true;
  const ans=String(curQ.answer||'').replace(/\s/g,'');
  fillIsCorrect=userFill.replace(/\s/g,'')===ans||userFill.replace(/\s/g,'').toLowerCase()===ans.toLowerCase();
  saveRecord(fillIsCorrect);if(!fillIsCorrect)saveError(curQ);renderQuestion();
}
function markSolveCorrect(isBatch){
  if(isBatch){const q=batchQuestions[batchIdx];if(q&&q._status==='ready'){q._submitted=true;q._isCorrect=true;saveRecord(true);renderBatchQuestions()}}
  else{saveRecord(true)}toast('已记录：做对了')
}
function markSolveWrong(isBatch){
  if(isBatch){const q=batchQuestions[batchIdx];if(q&&q._status==='ready'){q._submitted=true;q._isCorrect=false;saveRecord(false);saveError(q,curChapter);renderBatchQuestions()}}
  else{saveRecord(false);saveError(curQ)}toast('已加入错题本')
}

// ==================== 考试模式 ====================
function examSelOpt(qi,i){if(!curQ||curQ.type!=='exam'||(curQ._examSubmitted&&curQ._examSubmitted[qi]))return;curQ._examAnswers=curQ._examAnswers||{};curQ._examAnswers[qi]=i;renderExamPage()}
function examSubmitOne(qi){if(!curQ||curQ.type!=='exam'||(curQ._examSubmitted&&curQ._examSubmitted[qi]))return;if(curQ._examAnswers[qi]===undefined){toast('请先选择选项');return}curQ._examSubmitted=curQ._examSubmitted||{};curQ._examCorrect=curQ._examCorrect||{};curQ._examSubmitted[qi]=true;let q=null,c=0;curQ.sections.forEach(s=>{s.questions.forEach(qq=>{if(c===qi)q=qq;c++})});if(q)curQ._examCorrect[qi]=(curQ._examAnswers[qi]===q.answer);if(curQ._examCorrect[qi])saveRecord(true);else{saveRecord(false);if(q)saveError(q,curChapter)}renderExamPage()}
function examSubmitFill(qi){if(!curQ||curQ.type!=='exam'||(curQ._examSubmitted&&curQ._examSubmitted[qi]))return;const inp=$('efill'+qi);if(!inp||!inp.value.trim()){toast('请输入答案');return}curQ._examAnswers=curQ._examAnswers||{};curQ._examSubmitted=curQ._examSubmitted||{};curQ._examCorrect=curQ._examCorrect||{};curQ._examAnswers[qi]=inp.value.trim();curQ._examSubmitted[qi]=true;let q=null,c=0;curQ.sections.forEach(s=>{s.questions.forEach(qq=>{if(c===qi)q=qq;c++})});if(q){const a=String(q.answer||'').replace(/\s/g,''),ua=curQ._examAnswers[qi].replace(/\s/g,'');curQ._examCorrect[qi]=(ua===a||ua.toLowerCase()===a.toLowerCase())}if(curQ._examCorrect[qi])saveRecord(true);else{saveRecord(false);if(q)saveError(q,curChapter)}renderExamPage()}
function submitExam(){if(!curQ||curQ.type!=='exam')return;if(examTimer){clearInterval(examTimer);examTimer=null}let t=0,g=0;curQ.sections.forEach((sec,si)=>{sec.questions.forEach((q,qi)=>{const idx=si===0?qi:(si===1?qi+10:qi+15);if(q.type==='choice'){t+=4;if(curQ._examCorrect&&curQ._examCorrect[idx])g+=4}else if(q.type==='fill'){t+=5;if(curQ._examCorrect&&curQ._examCorrect[idx])g+=5}})});const p=t>0?Math.round(g/t*100):0;let m=`客观题：${g}/${t}分`;if(t>0)m+=` | 得分率 ${p}%`;const el=$('examScore');if(el)el.textContent=m;toast(`交卷！${m}`)}
function startExamTimer(){if(examTimer)clearInterval(examTimer);examTimer=setInterval(()=>{if(examSeconds<=0){clearInterval(examTimer);examTimer=null;toast('时间到！自动交卷');submitExam();return}examSeconds--;const el=$('examTimer');if(el){el.textContent=formatTime(examSeconds);if(examSeconds<300)el.classList.add('warn')}},1000)}
function formatTime(s){const m=Math.floor(s/60),sec=s%60;return`${String(m).padStart(2,'0')}:${String(sec).padStart(2,'0')}`}

function renderExamPage(){

async function validateApiKey(key,url,model){
  const mType=getModelType(model);
  try{
    if(mType==='claude'){
      const r=await fetch(url||'https://api.anthropic.com/v1/messages',{method:'POST',headers:{'Content-Type':'application/json','x-api-key':key,'anthropic-version':'2023-06-01'},body:JSON.stringify({model:model||'claude-3-haiku-20240307',max_tokens:10,messages:[{role:'user',content:'Reply OK'}],temperature:0}),signal:AbortSignal.timeout(15000)});
      if(!r.ok){const t=await r.text();let m='';try{m=JSON.parse(t).error?.message||t}catch(e){m=t};return{ok:false,msg:diagnoseError(r.status,m)}}
      return{ok:true,msg:'验证通过'};
    }else{
      const r=await fetch(url||'https://api.deepseek.com/v1/chat/completions',{method:'POST',headers:{'Content-Type':'application/json','Authorization':`Bearer ${key}`},body:JSON.stringify({model:model||'deepseek-chat',messages:[{role:'user',content:'Reply OK'}],max_tokens:10,temperature:0}),signal:AbortSignal.timeout(15000)});
      if(!r.ok){const t=await r.text();return{ok:false,msg:diagnoseError(r.status,t)}}
      return{ok:true,msg:'验证通过'};
    }
  }catch(e){return{ok:false,msg:e.name==='TimeoutError'?'连接超时':`连接失败: ${e.message}`}}
}

function onModelChange2(){$('cfgUrl2').value=getDefaultUrl($('cfgModel2').value);if(getModelType($('cfgModel2').value)==='claude'){$('cfgTemp2').value='0.1';$('cfgMt2').value='4096'}}
async function applyConfigMobile(){

async function testApiConfigMobile(){
  const key=$('cfgKey2').value.trim(),model=$('cfgModel2').value,url=$('cfgUrl2').value.trim();

// 数学符号快捷栏
function insertMath(idx,latex){
  const inp=$('fillAnswer'+idx);
  if(!inp)return;
  const start=inp.selectionStart,end=inp.selectionEnd;
  const val=inp.value;
  inp.value=val.substring(0,start)+latex+val.substring(end);
  inp.selectionStart=inp.selectionEnd=start+latex.length;
  inp.focus();
}

// 护眼模式
function toggleBlueLight(){document.body.classList.toggle('bluelight');toast(document.body.classList.contains('bluelight')?'护眼模式已开启':'护眼模式已关闭')}

// 屏幕常亮
let wakeLock=null;
async function requestWakeLock(){
  if(!isMobile()||document.visibilityState!=='visible')return;
  try{if(wakeLock)return;wakeLock=await navigator.wakeLock.request('screen');wakeLock.addEventListener('release',()=>{wakeLock=null})}catch(e){}
}
document.addEventListener('visibilitychange',()=>{if(document.visibilityState==='visible'&&mobileTab==='quiz')requestWakeLock()});

// 单题计时
function startQTimer(){qTimerStart=Date.now();if(qTimerInterval)clearInterval(qTimerInterval);qTimerInterval=setInterval(updateQTimer,1000)}
function stopQTimer(){if(qTimerInterval){clearInterval(qTimerInterval);qTimerInterval=null}const elapsed=Math.floor((Date.now()-qTimerStart)/1000);$('mobileTimerEl')?.remove();return elapsed}
function updateQTimer(){
  const elapsed=Math.floor((Date.now()-qTimerStart)/1000);
  let el=$('mobileTimerEl');if(!el){el=document.createElement('span');el.id='mobileTimerEl';el.className='mobile-timer';const tb=$('topTitle');if(tb)tb.after(el)}
  if(el)el.textContent=`⏱ ${elapsed}s`;
}

// 滑动切换题目
let touchStartX=0,touchStartY=0;
document.addEventListener('touchstart',e=>{touchStartX=e.touches[0].clientX;touchStartY=e.touches[0].clientY},{passive:true});
document.addEventListener('touchend',e=>{
  if(!isMobile()||curTab!=='quiz'||isLoading)return;
  const dx=e.changedTouches[0].clientX-touchStartX;
  const dy=e.changedTouches[0].clientY-touchStartY;
  if(Math.abs(dx)<60||Math.abs(dx)<Math.abs(dy))return;
  // Only swipe for batch questions, never open sidebar
  if(dx<0&&batchQuestions.length>1&&batchIdx<batchQuestions.length-1){switchBatchTab(batchIdx+1)}
  else if(dx>0&&batchQuestions.length>1&&batchIdx>0){switchBatchTab(batchIdx-1)}
});

// 数据导入导出
function exportAllData(){
  const data={stats:getStats(),errors:getErrors(),tplUsed:tplUsed,grade:userGrade,goal:userGoal,dark:document.body.classList.contains('dark'),config:{key:localStorage.getItem('bjm_key')||'',url:localStorage.getItem('bjm_url')||'',model:localStorage.getItem('bjm_model')||'',mt:localStorage.getItem('bjm_mt')||'',temp:localStorage.getItem('bjm_temp')||''}};
  const b=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});
  const u=URL.createObjectURL(b),a=document.createElement('a');a.href=u;a.download=`bjmath_backup_${new Date().toISOString().slice(0,10)}.json`;a.click();URL.revokeObjectURL(u);toast('数据已导出')
}
function importAllData(){
  const inp=document.createElement('input');inp.type='file';inp.accept='.json';
  inp.onchange=async e=>{
    const f=e.target.files[0];if(!f)return;
    try{const t=await f.text();const d=JSON.parse(t);
      if(d.stats)localStorage.setItem('bjm_stats',JSON.stringify(d.stats));
      if(d.errors)localStorage.setItem('bjm_errors',JSON.stringify(d.errors));
      if(d.tplUsed)localStorage.setItem('bjm_tpl_used',JSON.stringify(d.tplUsed));
      if(d.grade)localStorage.setItem('bjm_grade',String(d.grade));
      if(d.goal)localStorage.setItem('bjm_goal',d.goal);
      if(d.config){if(d.config.key)localStorage.setItem('bjm_key',d.config.key);if(d.config.url)localStorage.setItem('bjm_url',d.config.url);if(d.config.model)localStorage.setItem('bjm_model',d.config.model);if(d.config.mt)localStorage.setItem('bjm_mt',d.config.mt);if(d.config.temp)localStorage.setItem('bjm_temp',d.config.temp)}
      location.reload();toast('数据导入成功，页面即将刷新')
    }catch(e){toast('导入失败：'+e.message)}
  };inp.click();
}

// 添加到桌面提示
function checkPWA(){
  // PWA安装由beforeinstallprompt事件和initPWA()统一处理
  // 保留此函数用于向后兼容：iOS等不支持beforeinstallprompt的设备
  if(isMobile()&&!localStorage.getItem('bjm_pwa_hint')&&!pwaInstalled&&window.matchMedia('(display-mode: browser)').matches){
    setTimeout(()=>{
      const bar=document.createElement('div');

      bar.innerHTML='<span style="flex:1">📱 添加到桌面：在浏览器菜单中选择「添加到主屏幕」</span><button style="background:transparent;border:none;color:var(--txt2);cursor:pointer;font-size:16px;padding:4px" onclick="this.parentElement.remove();localStorage.setItem(\'bjm_pwa_hint\',\'1\')">✕</button>';
      document.body.appendChild(bar);
      localStorage.setItem('bjm_pwa_hint','1');

}

// 修改切换tab以支持手机
const origSwitchTab=switchTab;
switchTab=function(tab){
  curTab=tab;if(examTimer){clearInterval(examTimer);examTimer=null}
  if(isMobile()&&tab!=='quiz'){stopQTimer();releaseWakeLock()}
  if(isMobile()&&tab==='quiz'){requestWakeLock();if(curQ&&!submitted)startQTimer()}
  origSwitchTab(tab);
  if(isMobile()){$('bnQuiz').classList.toggle('active',tab==='quiz');$('bnErr').classList.toggle('active',tab==='errors')}
};
function releaseWakeLock(){if(wakeLock){wakeLock.release().catch(()=>{});wakeLock=null}}

// 修改generateQuestion以支持计时
const origGenerateQuestion=generateQuestion;
generateQuestion=async function(){
  stopQTimer();await origGenerateQuestion();
  if(isMobile()&&curQ&&!submitted)startQTimer();
};

// 修改submit相关函数以支持计时
const origSubmitChoice=submitChoice;const origSubmitFill=submitFill;
submitChoice=function(){stopQTimer();origSubmitChoice()};
submitFill=function(){stopQTimer();origSubmitFill()};

// ==================== PWA 渐进式Web应用 ====================
let deferredPrompt=null;
let pwaInstalled=false;

function createManifestBlob(){
  const manifest={
    name:'北京数学刷题 - AI增强版',
    short_name:'北京数学刷题',
    description:'北京高中数学联网刷题工具，AI智能出题，支持北京卷风格',
    start_url:location.href.split('?')[0],
    display:'standalone',
    background_color:'#F0F4FF',
    theme_color:'#165DFF',
    orientation:'any',
    lang:'zh-CN',
    categories:['education','productivity'],
    icons:[{
      src:'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192"><rect width="192" height="192" rx="32" fill="#165DFF"/><text x="96" y="108" text-anchor="middle" font-size="80" font-family="sans-serif" font-weight="bold" fill="white">BJ</text><text x="96" y="152" text-anchor="middle" font-size="24" font-family="sans-serif" fill="rgba(255,255,255,0.8)">数学</text></svg>'),
      sizes:'192x192',type:'image/svg+xml',purpose:'any'
    },{
      src:'data:image/svg+xml,'+encodeURIComponent('<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512"><rect width="512" height="512" rx="80" fill="#165DFF"/><text x="256" y="280" text-anchor="middle" font-size="200" font-family="sans-serif" font-weight="bold" fill="white">BJ</text><text x="256" y="380" text-anchor="middle" font-size="56" font-family="sans-serif" fill="rgba(255,255,255,0.8)">数学</text></svg>'),
      sizes:'512x512',type:'image/svg+xml',purpose:'any'
    }]
  };
  const blob=new Blob([JSON.stringify(manifest)],{type:'application/json'});
  return URL.createObjectURL(blob);
}

function initPWA(){
  // 设置manifest
  try{
    const manifestUrl=createManifestBlob();
    const link=$('manifestLink');
    if(link)link.href=manifestUrl;
  }catch(e){}

  // 注册Service Worker
  if('serviceWorker' in navigator){
    const swCode=`
const CACHE_NAME='bjm-pwa-v2';
const MATHJAX_CDN='cdn.jsdelivr.net';

self.addEventListener('install',e=>{
  self.skipWaiting();
});

self.addEventListener('activate',e=>{
  e.waitUntil(self.clients.claim());
  // 清理旧缓存
  e.waitUntil(caches.keys().then(keys=>Promise.all(keys.filter(k=>k!==CACHE_NAME).map(k=>caches.delete(k)))));
});

self.addEventListener('fetch',e=>{
  if(e.request.method!=='GET')return;
  const url=new URL(e.request.url);
  // MathJax CDN：缓存优先
  if(url.hostname.includes(MATHJAX_CDN)){
    e.respondWith(caches.match(e.request).then(c=>c||fetch(e.request).then(r=>{const rc=r.clone();caches.open(CACHE_NAME).then(cc=>cc.put(e.request,rc));return r})));
  }
  // 本地资源（应用外壳）：网络优先，离线回退缓存
  else if(url.origin===location.origin){
    e.respondWith(fetch(e.request).then(r=>{const rc=r.clone();caches.open(CACHE_NAME).then(cc=>cc.put(e.request,rc));return r}).catch(()=>caches.match(e.request)));
  }
  // 其他：网络优先
  else{
    e.respondWith(fetch(e.request).catch(()=>caches.match(e.request)));
  }
});

self.addEventListener('message',e=>{
  if(e.data==='skipWaiting')self.skipWaiting();
});
`;
    try{
      const swBlob=new Blob([swCode],{type:'application/javascript'});
      const swUrl=URL.createObjectURL(swBlob);
      navigator.serviceWorker.register(swUrl,{scope:'/'}).then(reg=>{
        console.log('SW registered');
        // 监听更新
        reg.addEventListener('updatefound',()=>{
          const newWorker=reg.installing;
          if(newWorker){
            newWorker.addEventListener('statechange',()=>{
              if(newWorker.state==='installed'&&navigator.serviceWorker.controller){
                if(confirm('有新版本可用，是否刷新？')){newWorker.postMessage('skipWaiting');location.reload()}
              }
            });
          }
        });
      }).catch(()=>{}); // 部分浏览器不支持blob SW，静默失败
    }catch(e){}
  }
}

// 安装提示
window.addEventListener('beforeinstallprompt',e=>{
  e.preventDefault();
  deferredPrompt=e;
  // 延迟显示安装提示
  setTimeout(()=>{
    if(deferredPrompt&&!pwaInstalled){
      const installBar=document.createElement('div');
      installBar.id='pwaInstallBar';
      installBar.style.cssText='position:fixed;bottom:64px;left:16px;right:16px;background:var(--card);backdrop-filter:var(--blur);-webkit-backdrop-filter:var(--blur);border:1px solid var(--pri);border-radius:12px;padding:12px 16px;z-index:50;display:flex;align-items:center;gap:12px;box-shadow:0 4px 20px rgba(22,93,255,0.2);font-size:13px;color:var(--txt);animation:slideUp 0.3s ease';
      installBar.innerHTML=`<span style="flex:1">📱 安装到桌面，离线也能刷题</span><button style="background:var(--pri);color:#fff;border:none;border-radius:8px;padding:6px 16px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font)" onclick="installPWA()">安装</button><button style="background:transparent;border:none;color:var(--txt2);cursor:pointer;font-size:16px;padding:4px" onclick="dismissPWAInstall()">✕</button>`;
      document.body.appendChild(installBar);
    }
  },5000);
});
window.addEventListener('appinstalled',()=>{
  pwaInstalled=true;deferredPrompt=null;
  const bar=$('pwaInstallBar');if(bar)bar.remove();
});

async function installPWA(){
  if(!deferredPrompt)return;
  deferredPrompt.prompt();
  const result=await deferredPrompt.userChoice;
  deferredPrompt=null;
  const bar=$('pwaInstallBar');if(bar)bar.remove();
  if(result.outcome==='accepted'){pwaInstalled=true;toast('已添加到桌面')}
}

function dismissPWAInstall(){
  deferredPrompt=null;
  const bar=$('pwaInstallBar');if(bar)bar.remove();
}

// 在线/离线状态提示
window.addEventListener('online',()=>toast('🌐 网络已恢复'));
window.addEventListener('offline',()=>toast('📡 已离线，缓存内容仍可用'));

// ==================== 初始化 ====================
function init(){
  initPWA();
  try{tplUsed=JSON.parse(localStorage.getItem('bjm_tpl_used')||'{}')}catch(e){tplUsed={}}
  try{dedupHistory=JSON.parse(localStorage.getItem('bjm_dedup')||'{}')}catch(e){dedupHistory={}}
  if(localStorage.getItem('bjm_dark')==='1'){
    document.body.classList.add('dark');$('btnDark').textContent='☀️ 日间模式';$('btnDark2').textContent='☀️';
  }
  if(speedMode){const el=$('speedTg');if(el)el.classList.add('on')}
  updateErrCount();updateGradeBadge();renderSidebar();
  const cfg=getApiConfig();
  const hasUsed=localStorage.getItem('bjm_has_used');
  if(!hasUsed){showOnboarding();localStorage.setItem('bjm_has_used','1')}
  if(!cfg.key){
    $('mainContent').innerHTML=`<div class="empty"><div class="empty-icon">🔑</div><p style="font-size:17px;font-weight:700">欢迎使用北京数学刷题AI增强版</p><p style="margin-top:8px;color:var(--err)">请先配置API Key</p><p style="margin-top:12px;font-size:12px;color:var(--txt2)">展开${isMobile()?'设置页':'右侧'}API配置 → 输入Key → 开始刷题</p></div>`;
  }else{
    $('mainContent').innerHTML=`<div class="empty"><div class="empty-icon">✅</div><p style="font-size:17px;font-weight:700">API已配置</p><p style="margin-top:6px">模型：${cfg.model}</p><p style="margin-top:8px;font-size:12px;color:var(--txt2)">选择${isMobile()?'底部「题库」':'左侧章节'}开始刷题</p></div>`;
  }
  // 手机端PWA提示
  checkPWA();
  // 系统深色模式自动适配
  if(!localStorage.getItem('bjm_dark')&&window.matchMedia('(prefers-color-scheme:dark)').matches){toggleDark()}
}
init();
</script>
